apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-typo
  namespace: drills
spec:
  replicas: 1
  selector:
    matchLabels: {app: hello-api}
  template:
    metadata:
      labels: {app: hello-api}
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksctsai/hello-api:v2.0.1
---
apiVersion: v1
kind: Service
metadata:
  name: selector-typo
  namespace: drills
  labels:
    app: hello-api
spec:
  type: NodePort
  selector:
    app: hello-apii
  ports:
    - port: 80
      targetPort: 8080
