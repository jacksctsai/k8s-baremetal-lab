apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: drills
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-pending
  namespace: drills
spec:
  replicas: 1
  selector:
    matchLabels: {app: pvc-pending}
  template:
    metadata:
      labels: {app: pvc-pending}
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksctsai/hello-api:v2.0.1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
