apiVersion: v1
kind: Service
metadata:
  name: hello-api-service
  labels:
    app.kubernetes.io/name: hello-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hello-api
  ports:
    - name: http
      protocol: TCP
      port: 8080 # service cluster port
      targetPort: http # matches container port
      nodePort: 30080 # port exposed on node IPs (range: 30000 ~ 32767)